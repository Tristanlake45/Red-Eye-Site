  <div class="lightbox" id="lightbox" aria-hidden="true">

          <button class="icon-btn" id="lb-next" type="button">Next</button>
        </div>

        <div class="lightbox-right">
          <a class="icon-btn" id="lb-open" href="#" target="_blank" rel="noopener">Open</a>
          <button class="icon-btn" id="lb-close" type="button">Close</button>
        </div>
      </div>

      <div class="lightbox-body">
        <img id="lb-img" alt="">
      </div>
    </div>

  <script>
    // Lightbox for GRAPHICS + PHOTOGRAPHY
    (function(){
      const galleryLinks = Array.from(document.querySelectorAll("#gallery .gallery-item, #photo-gallery .gallery-item"));
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");
      const btnPrev = document.getElementById("lb-prev");
      const btnNext = document.getElementById("lb-next");
      const btnClose = document.getElementById("lb-close");
      const openLink = document.getElementById("lb-open");

      let index = 0;

      function setIndex(newIndex){
        index = (newIndex + galleryLinks.length) % galleryLinks.length;
        const href = galleryLinks[index].getAttribute("href");
        lbImg.src = href;
        lbImg.alt = "Red Eye Films work image";
        openLink.href = href;
      }

      function openLightbox(startIndex){
        setIndex(startIndex);
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        btnNext.focus();
      }

      function closeLightbox(){
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        lbImg.src = "";
        openLink.href = "#";
        document.body.style.overflow = "";
        galleryLinks[index]?.focus?.();
      }

      function next(){ setIndex(index + 1); }
      function prev(){ setIndex(index - 1); }

      galleryLinks.forEach((a, i) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openLightbox(i);
        });
      });

      btnNext.addEventListener("click", next);
      btnPrev.addEventListener("click", prev);
      btnClose.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (e) => {
        if(e.target === lightbox) closeLightbox();
      });

      window.addEventListener("keydown", (e) => {
        if(!lightbox.classList.contains("open")) return;
        if(e.key === "Escape") closeLightbox();
        if(e.key === "ArrowRight") next();
        if(e.key === "ArrowLeft") prev();
      });

      lbImg.addEventListener("click", next);
    })();

    loadPartial("#nav-slot", "/partials/nav.html");
    loadPartial("#footer-slot", "/partials/footer.html");
    setYear();
  </script>
