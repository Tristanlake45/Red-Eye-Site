  <script>
    // Lightbox for GRAPHICS + PHOTOGRAPHY
    (function(){
      const galleryLinks = Array.from(document.querySelectorAll("#gallery .gallery-item, #photo-gallery .gallery-item"));
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lb-img");
      const btnClose = document.getElementById("lb-close");
      let activeLink = null;

      function openLightbox(link){
        activeLink = link;
        const source = link.querySelector("img");
        const start = source.getBoundingClientRect();
        lbImg.src = link.getAttribute("href");
        lbImg.alt = source.alt;
        lightbox.classList.add("open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const end = lbImg.getBoundingClientRect();
          const dx = start.left + start.width / 2 - (end.left + end.width / 2);
          const dy = start.top + start.height / 2 - (end.top + end.height / 2);
          const sx = Math.max(.05, start.width / end.width);
          const sy = Math.max(.05, start.height / end.height);
          lbImg.animate([
            { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`, filter: "blur(8px)", opacity: .45 },
            { transform: "translate(0,0) scale(1)", filter: "blur(0)", opacity: 1 }
          ], { duration: 620, easing: "cubic-bezier(.16,1,.3,1)" });
        }));
        btnClose.focus({ preventScroll: true });
      }

      function closeLightbox(){
        lightbox.classList.add("is-closing");
        lightbox.classList.remove("open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        window.setTimeout(() => {
          lightbox.classList.remove("is-closing");
          lbImg.src = "";
        }, 420);
        activeLink?.focus?.({ preventScroll: true });
      }

      galleryLinks.forEach((a) => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          openLightbox(a);
        });
      });

      btnClose.addEventListener("click", closeLightbox);

      lightbox.addEventListener("click", (e) => {
        if(e.target === lightbox) closeLightbox();
      });

      window.addEventListener("keydown", (e) => {
        if(!lightbox.classList.contains("open")) return;
        if(e.key === "Escape") closeLightbox();
      });
    })();

    loadPartial("#nav-slot", "/partials/nav.html");
    loadPartial("#footer-slot", "/partials/footer.html");
    setYear();
  </script>
